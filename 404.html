<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Redirecting…</title>
    <style>html,body{height:100%;margin:0;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#fff;font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial}</style>
    <script type="text/javascript">
      (function() {
        var l = window.location;
        var parts = l.pathname.split('/');
        // Default to keeping 1 path segment for repository subpath (e.g. /interactive-education-platform/)
        var pathSegmentsToKeep = 1;
        if (parts.length <= 2 || parts[1] !== 'interactive-education-platform') {
          pathSegmentsToKeep = 0;
        }
        var base = l.protocol + '//' + l.host + parts.slice(0, 1 + pathSegmentsToKeep).join('/') + '/';
        var route = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        var search = l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '';
        var target = base + '?p=' + encodeURIComponent(route) + search + l.hash;
        l.replace(target);
      })();
    </script>
  </head>
  <body>
    <div>
      <h1 style="font-weight:700;margin:0 0 8px 0">Redirecting...</h1>
      <p style="margin:0;opacity:.85">If you are not redirected automatically, <a href="/" style="color:#93c5fd">click here</a>.</p>
    </div>
  </body>
</html>
