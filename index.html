    <script type="text/javascript">
      // Force auto-reload if asset chunk fails due to new deployment
      window.addEventListener('error', function(e) {
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          if (!sessionStorage.getItem('noble_asset_reloaded')) {
            sessionStorage.setItem('noble_asset_reloaded', 'true');
            window.location.reload(true);
          }
        }
      }, true);
    </script>

    
    <!-- GitHub Pages SPA Route Restorer -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === 'p') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).filter(function(s) {
            return s.slice(0, 2) === 'p=';
          })[0];
          if (decoded) {
            var path = decodeURIComponent(decoded.slice(2));
            var q = l.search.slice(1).split('&').filter(function(s) {
              return s.slice(0, 2) === 'q=';
            })[0];
            var search = q ? '?' + q.slice(2).replace(/~and~/g, '&') : '';
            var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
            var cleanPath = path.startsWith('/') ? path : '/' + path;
            window.history.replaceState(null, null, basePath + cleanPath + search + l.hash);
          }
        }
      }(window.location));
    </script>

    <!-- Google Translate Element Loader & React Crash Fix -->
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,gu,hi,mr,ta,te,kn,ml',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }

      // Prevents React from crashing (blank white canvas) when Google Translate mutates text nodes
      if (typeof Node === 'function' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child.parentNode !== this) {
            return child;
          }
          return originalRemoveChild.call(this, child);
        };
        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            return newNode;
          }
          return originalInsertBefore.call(this, newNode, referenceNode);
        };
      }

      // Forcefully remove Google Translate inline body/html layout shifts
      const forceResetStyles = () => {
        if (document.body && (document.body.style.top || document.body.style.marginTop)) {
          document.body.style.top = '0px';
          document.body.style.marginTop = '0px';
        }
        if (document.documentElement && (document.documentElement.style.top || document.documentElement.style.marginTop)) {
          document.documentElement.style.top = '0px';
          document.documentElement.style.marginTop = '0px';
        }
      };
      
      setInterval(forceResetStyles, 100);
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <body>
    <div id="root"></div>

    <script>
      (function(){
        const removeOverlay = () => {
          const el = document.getElementById('noble-loading-overlay');
          if (el) { el.style.display = 'none'; window.__noble_loader_removed_by_fallback = true; return true; }
          return false;
        };
        let attempts = 0;
        const iv = setInterval(() => {
          if (removeOverlay() || attempts++ > 24) clearInterval(iv);
        }, 500);
        setTimeout(() => { removeOverlay(); }, 12000);
      })();
    </script>
