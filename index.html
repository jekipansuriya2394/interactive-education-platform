    <!-- Google Translate Element Loader -->
    <!-- Google Translate Element Loader & React Crash Fix -->
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,gu,hi,mr,ta,te,kn,ml',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }

      // Prevents React from crashing (blank white canvas) when Google Translate mutates text nodes
      if (typeof Node === 'function' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child.parentNode !== this) {
            return child;
          }
          return originalRemoveChild.call(this, child);
        };
        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            return newNode;
          }
          return originalInsertBefore.call(this, newNode, referenceNode);
        };
      }

      // Forcefully remove Google Translate inline body/html layout shifts
      const forceResetStyles = () => {
        if (document.body && (document.body.style.top || document.body.style.marginTop)) {
          document.body.style.top = '0px';
          document.body.style.marginTop = '0px';
        }
        if (document.documentElement && (document.documentElement.style.top || document.documentElement.style.marginTop)) {
          document.documentElement.style.top = '0px';
          document.documentElement.style.marginTop = '0px';
        }
      };
      
      setInterval(forceResetStyles, 100);
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
