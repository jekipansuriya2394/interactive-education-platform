<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Red accent bar at bottom -->
  <rect x="56" y="408" width="400" height="36" rx="18" fill="url(#accent)"/>
  <!-- Letter N (geometric paths) -->
  <g fill="#ffffff">
    <!-- N: left vertical -->
    <rect x="68" y="80" width="52" height="300" rx="4"/>
    <!-- N: right vertical -->
    <rect x="216" y="80" width="52" height="300" rx="4"/>
    <!-- N: diagonal -->
    <polygon points="68,80 120,80 268,380 216,380"/>
  </g>
  <!-- Letter E (geometric paths) -->
  <g fill="#ffffff">
    <!-- E: vertical -->
    <rect x="296" y="80" width="52" height="300" rx="4"/>
    <!-- E: top bar -->
    <rect x="296" y="80" width="160" height="48" rx="4"/>
    <!-- E: middle bar -->
    <rect x="296" y="206" width="136" height="44" rx="4"/>
    <!-- E: bottom bar -->
    <rect x="296" y="332" width="160" height="48" rx="4"/>
  </g>
</svg>
