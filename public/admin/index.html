<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Panel - Redirecting...</title>
  <style>html,body{height:100%;margin:0;display:flex;align-items:center;justify-content:center;font-family:system-ui,Segoe UI,Roboto;background:#0f172a;color:#fff}body{flex-direction:column;gap:20px}</style>
  <script type="text/javascript">
    (function() {
      var l = window.location;
      var parts = l.pathname.split('/');
      var pathSegmentsToKeep = 1;
      if (parts.length <= 2 || parts[1] !== 'interactive-education-platform') {
        pathSegmentsToKeep = 0;
      }
      var base = l.protocol + '//' + l.host + parts.slice(0, 1 + pathSegmentsToKeep).join('/') + '/';
      try {
        sessionStorage.setItem('noble_admin_intent', '/admin');
      } catch(e) {}
      var target = base + '?p=admin' + (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash;
      l.replace(target);
    })();
  </script>
</head>
<body>
  <div style="text-align:center">
    <h2>Loading Admin Panel...</h2>
    <p style="opacity:0.7">Please wait while we load the interface...</p>
  </div>
</body>
</html>
